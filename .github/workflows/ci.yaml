name: Build and Lint
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang-format clang-tidy

      - name: Build
        run: make

      - name: Lint with clang-format & clang-tidy
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'          # use .clang-format file in the repo
          tidy-checks: ''        # use .clang-tidy file in the repo
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}

      - name: Fail if lint issues found
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1